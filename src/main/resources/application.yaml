server:
  port: 8080

spring:
  application:
    name: RenewCommunity
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.renewcommunity.renewcommunity.entity
  configuration:
    map-underscore-to-camel-case: true

sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

app:
  cors:
    allowed-origins:
      - http://localhost:9527
      # uni-app H5 开发服务器
      - http://localhost:5173
  wechat:
    # 微信小程序登录必需；未配置时微信登录接口会返回业务错误
    app-id: ${WECHAT_APP_ID:}
    secret: ${WECHAT_SECRET:}
  file:
    # 资料台账的文件存储目录，默认为 ~/renewcommunity/uploads
    storage-path: ${FILE_STORAGE_PATH:}

logging:
  level:
    com.renewcommunity.renewcommunity: info
