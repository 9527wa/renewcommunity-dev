server:
  port: 8080

spring:
  application:
    name: RenewCommunity
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.renewcommunity.renewcommunity.entity
  configuration:
    map-underscore-to-camel-case: true

sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

app:
  security:
    # 引导管理员账号，接入用户表后删除
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:123456}
    nickname: 管理员
    roles:
      - R_SUPER
  cors:
    allowed-origins:
      - http://localhost:9527

logging:
  level:
    com.renewcommunity.renewcommunity: info
